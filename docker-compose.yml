version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dataset_desk_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dataset_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataset_desk"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: dataset_desk_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/dataset_desk
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/dataset_desk
      - SECRET_KEY=super-secret-jwt-key-dataset-request-desk-2026
      - SEED_DIR=/app/seed
    ports:
      - "8000:8000"
    volumes:
      - ./seed:/app/seed
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dataset_desk_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
